plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}
version = mod_version
group = maven_group
base { archivesName = archives_base_name }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
sourceSets.main.resources.srcDir 'src/generated/resources'
repositories {
    mavenCentral()
    maven { url = 'https://modmaven.dev/' }
}
neoForge {
    version = neoforge_version
    mods { mae2 { sourceSet sourceSets.main } }
    runs {
        configureEach {
            gameDirectory = file('run/' + name)
            systemProperty 'neoforge.enabledGameTestNamespaces', 'mae2'
            systemProperty 'mixin.debug.verify', 'true'
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
            if (project.hasProperty('serverAddress')) programArguments.addAll '--quickPlayMultiplayer', project.property('serverAddress')
        }
        server { server(); programArgument '--nogui' }
        gameTestServer { type = 'gameTestServer' }
        data {
            data()
            programArguments.addAll '--mod', 'mae2', '--all', '--output', file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
    }
}
dependencies {
    // Exact local artifacts prepared and verified by scripts/prepare_dependencies.py.
    implementation files('dependencies/appliedenergistics2-19.2.18.jar')
    implementation files('dependencies/gtceu-1.21.1-8.0.0.jar')
    compileOnly fileTree('dependencies/compileOnly') { include '*.jar' }
    implementation files('dependencies/guideme-21.1.1.jar')
    compileOnly 'org.jetbrains:annotations:26.0.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
configurations.configureEach {
    exclude group: 'appeng'
    exclude group: 'com.gregtechceu.gtceu'
    exclude group: 'org.appliedenergistics', module: 'appliedenergistics2'
}
test { useJUnitPlatform() }
processResources {
    def props = [mod_id:mod_id, version:version, mod_name:mod_name, mod_author:mod_author,
                 mod_license:mod_license, mod_url:mod_url, neoforge_version:neoforge_version]
    exclude '.cache/**'
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-Xmaxerrs', '500'] }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('runServer') { standardInput = System.in }

processResources {
    from('dependencies.lock.json') {
        into 'META-INF'
        rename { 'mae2-dependencies.json' }
    }
}

def sha256 = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] chunk = new byte[65536]
        int size
        while ((size = input.read(chunk)) != -1) digest.update(chunk, 0, size)
    }
    digest.digest().encodeHex().toString()
}
tasks.register('verifyPinnedDependencies') {
    group = 'verification'
    inputs.file('dependencies.lock.json')
    inputs.files('dependencies/appliedenergistics2-19.2.18.jar', 'dependencies/gtceu-1.21.1-8.0.0.jar', 'dependencies/guideme-21.1.1.jar')
    doLast {
        def pinned = new groovy.json.JsonSlurper().parse(file('dependencies.lock.json'))
        ['ae2', 'gt', 'guideme'].each { name ->
            def spec = pinned[name]
            def jar = file("dependencies/${spec.artifact}")
            if (!jar.isFile() || sha256(jar) != spec.sha256) {
                throw new GradleException("Pinned ${name} artifact is missing or changed. Run python3 scripts/prepare_dependencies.py")
            }
        }
    }
}
tasks.named('compileJava') { dependsOn 'verifyPinnedDependencies' }
tasks.register('dependencyEvidence') {
    group = 'verification'
    dependsOn 'verifyPinnedDependencies'
    doLast {
        def evidence = [:]
        ['compileClasspath', 'runtimeClasspath'].each { name ->
            evidence[name] = configurations[name].files.sort { it.name }.collect {
                [name: it.name, path: it.absolutePath, sha256: sha256(it)]
            }
        }
        def destination = layout.buildDirectory.file('reports/dependency-evidence.json').get().asFile
        destination.parentFile.mkdirs()
        destination.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(evidence)) + '\n'
    }
}

tasks.named('jar') { from('LICENSE.txt') }
